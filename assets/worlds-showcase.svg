<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- 1. Cosmos gradient (Project Atlas) -->
    <radialGradient id="c1-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#283066"/>
      <stop offset="100%" stop-color="#070912"/>
    </radialGradient>
    <!-- 2. Hacker Terminal gradient (Gob-Inc-shell) -->
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c11"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <!-- 3. Retro 2000s / WinXP gradient (Aski-Online & AI) -->
    <linearGradient id="c3-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- 4. RPG Fantasy gradient (RtCoD Mods) -->
    <radialGradient id="c4-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#132e24"/>
      <stop offset="100%" stop-color="#080e0c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Subtle outer container -->
  <rect width="1200" height="340" rx="16" fill="#090b10"/>

  <!-- ======================================================== -->
  <!-- CARD 1: COSMOS / CONSTELLATIONS (Project Atlas)          -->
  <!-- ======================================================== -->
  <g transform="translate(16, 16)">
    <rect width="280" height="308" rx="12" fill="url(#c1-bg)" stroke="#b4befe" stroke-opacity="0.38" stroke-width="1.5"/>
    <!-- Stars -->
    <g fill="#dbe4ff" opacity="0.45">
      <circle cx="34" cy="40" r="1.1"/><circle cx="240" cy="54" r="1.3"/><circle cx="62" cy="185" r="1.2"/>
      <circle cx="215" cy="170" r="1"/><circle cx="155" cy="36" r="1.2"/>
    </g>
    <!-- Mini Constellation -->
    <g transform="translate(140, 118)">
      <g stroke="#ebf0ff" stroke-opacity="0.45" stroke-width="1.2">
        <line x1="0" y1="0" x2="-68" y2="-42"/>
        <line x1="0" y1="0" x2="72" y2="-32"/>
        <line x1="0" y1="0" x2="54" y2="52"/>
        <line x1="0" y1="0" x2="-62" y2="44"/>
        <line x1="72" y1="-32" x2="105" y2="12"/>
      </g>
      <path d="M -68 -42 Q 20 -82 105 12" fill="none" stroke="#facc15" stroke-width="2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="14" fill="#161b33" stroke="#e4e6f8" stroke-width="2"/>
      <circle cx="-68" cy="-42" r="6.5" fill="#facc15" filter="url(#glow)"/>
      <circle cx="72" cy="-32" r="7.5" fill="#23284a" stroke="#b4befe" stroke-width="1.5"/>
      <circle cx="105" cy="12" r="6" fill="#f38ba8"/>
      <circle cx="54" cy="52" r="6" fill="#2dd4bf"/>
      <circle cx="-62" cy="44" r="5.5" fill="#74c7ec"/>
    </g>
    <!-- Text -->
    <g transform="translate(18, 224)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text y="0" font-size="10.5" font-weight="700" fill="#facc15">01 · COSMOS / VISUAL</text>
      <text y="24" font-size="18" font-weight="800" fill="#ffffff">Project Atlas</text>
      <text y="46" font-size="11.5" fill="#b4befe">60 FPS codebase universe</text>
      <text y="64" font-size="11" fill="#7c8299">Canvas · SVG · Static AST</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 2: CYBER / SYSTEMS (Gob-Inc-shell & Rust OCR)       -->
  <!-- ======================================================== -->
  <g transform="translate(312, 16)">
    <rect width="280" height="308" rx="12" fill="url(#c2-bg)" stroke="#e63946" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Scanline terminal preview -->
    <rect x="16" y="20" width="248" height="172" rx="8" fill="#0b0c12" stroke="#e63946" stroke-opacity="0.25"/>
    <rect x="16" y="20" width="248" height="22" rx="8" fill="#161219"/>
    <circle cx="30" cy="31" r="3.5" fill="#e63946"/>
    <circle cx="42" cy="31" r="3.5" fill="#facc15"/>
    <circle cx="54" cy="31" r="3.5" fill="#52b788"/>
    <text x="148" y="34" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#72778c">gob-inc-shell v2.0</text>
    <g transform="translate(26, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text y="0" fill="#e63946">❯ <tspan fill="#e4e6f8">cmake --build . -j</tspan></text>
      <text y="20" fill="#52b788">[OK] GLFW 3.4 Wayland</text>
      <text y="38" fill="#52b788">[OK] OpenGL 3.3 Core</text>
      <text y="56" fill="#72778c">pty: /dev/pts/1  0.4ms</text>
      <text y="78" fill="#e63946">❯ <tspan fill="#ff8fa3">cargo run --release</tspan></text>
      <text y="96" fill="#2dd4bf">[OCR] overlay ready ▌</text>
    </g>
    <!-- Text -->
    <g transform="translate(18, 224)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text y="0" font-size="10.5" font-weight="700" fill="#e63946">02 · NATIVE / SYSTEMS</text>
      <text y="24" font-size="18" font-weight="800" fill="#ffffff">Shell &amp; OCR</text>
      <text y="46" font-size="11.5" fill="#ff8fa3">GPU terminal + Rust overlay</text>
      <text y="64" font-size="11" fill="#7c8299">C++17 · Rust · Tauri · GL</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 3: RETRO 2000s / AI (Aski-Online & PromptForge)     -->
  <!-- ======================================================== -->
  <g transform="translate(608, 16)">
    <rect width="280" height="308" rx="12" fill="#101829" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Classic WinXP / ICQ retro window -->
    <rect x="18" y="22" width="244" height="168" rx="6" fill="#e5e7eb" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="18" y="22" width="244" height="24" rx="5" fill="url(#c3-bar)"/>
    <text x="28" y="38" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#ffffff">✿ Aski-Online // 2004</text>
    <rect x="242" y="27" width="14" height="14" rx="2" fill="#ef4444"/>
    <text x="249" y="37" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">×</text>
    <!-- Chat bubbles -->
    <g transform="translate(28, 62)" font-family="ui-monospace, monospace" font-size="10.5">
      <rect x="0" y="0" width="166" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
      <text x="8" y="18" fill="#1e293b">&lt;AI&gt; Uh-oh! Ready to ship?</text>
      <rect x="52" y="38" width="172" height="28" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="60" y="56" fill="#1e3a8a">&lt;You&gt; Deploy skills now!</text>
      <rect x="0" y="78" width="224" height="30" rx="4" fill="#0f172a"/>
      <text x="10" y="97" fill="#a6e3a1">PromptForge: 4 agents synced</text>
    </g>
    <!-- Text -->
    <g transform="translate(18, 224)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text y="0" font-size="10.5" font-weight="700" fill="#60a5fa">03 · RETRO / AI AGENTS</text>
      <text y="24" font-size="18" font-weight="800" fill="#ffffff">Aski &amp; PromptForge</text>
      <text y="46" font-size="11.5" fill="#93c5fd">2000s ICQ AI + Prompt Studio</text>
      <text y="64" font-size="11" fill="#7c8299">Python · LLMs · PyQt6</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 4: RPG FANTASY / GAMEDEV (RtCoD Forge Mods)         -->
  <!-- ======================================================== -->
  <g transform="translate(904, 16)">
    <rect width="280" height="308" rx="12" fill="url(#c4-bg)" stroke="#52b788" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Pixel / RPG HUD frame -->
    <rect x="18" y="22" width="244" height="168" rx="6" fill="#0c1512" stroke="#52b788" stroke-opacity="0.35" stroke-dasharray="6 3"/>
    <g transform="translate(32, 48)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text y="0" font-size="11" font-weight="700" fill="#a6e3a1">⚔ RTCoD RPG ENGINE</text>
      <text y="24" font-size="11" fill="#e4e6f8">RACE:  <tspan fill="#facc15" font-weight="700">20 Unique Races</tspan></text>
      <text y="44" font-size="11" fill="#e4e6f8">SCALE: <tspan fill="#52b788">3D Hitbox + Model</tspan></text>
      <text y="64" font-size="11" fill="#e4e6f8">CLASS: <tspan fill="#cba6f7">Active Abilities</tspan></text>
      <!-- RPG Stat Bars -->
      <text y="92" font-size="10" fill="#8b90b2">HP</text>
      <rect x="26" y="83" width="186" height="10" rx="3" fill="#1a2621"/>
      <rect x="26" y="83" width="154" height="10" rx="3" fill="#e63946"/>
      <text y="114" font-size="10" fill="#8b90b2">MP</text>
      <rect x="26" y="105" width="186" height="10" rx="3" fill="#1a2621"/>
      <rect x="26" y="105" width="132" height="10" rx="3" fill="#38bdf8"/>
    </g>
    <!-- Text -->
    <g transform="translate(18, 224)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text y="0" font-size="10.5" font-weight="700" fill="#52b788">04 · GAMEDEV / FORGE</text>
      <text y="24" font-size="18" font-weight="800" fill="#ffffff">RtCoD Suite</text>
      <text y="46" font-size="11.5" fill="#a6e3a1">RPG races, classes &amp; GUI</text>
      <text y="64" font-size="11" fill="#7c8299">Java · Minecraft 1.20.1</text>
    </g>
  </g>
</svg>
